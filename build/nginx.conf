server {
    listen 443 ssl;
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:AES128-GCM-SHA256:HIGH:!aNULL:!MD5';
    ssl_prefer_server_ciphers on;
    location / {
        proxy_pass http://127.0.0.1:3090;
        # The two critical lines: the dsh /api browser-trust fence validates the
        # Host header, and privileged methods (settings.*, credentials.*,
        # agentPreset.*) are hard-coded to loopback only -- --trusted-host does
        # NOT help them. Rewriting Host/Origin to loopback makes dsh treat every
        # request as same-origin local and accept it. Safe here because dsh only
        # listens on 127.0.0.1 and nginx is the single entry point.
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Origin http://127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
